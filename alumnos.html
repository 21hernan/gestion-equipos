<script>
    // --- CONFIGURACIÓN SUPABASE ---
    const SUPABASE_URL = 'https://qlmkyttfzsmnjmarkopv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsbWt5dHRmenNtbmptYXJrb3B2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMzUyMzAsImV4cCI6MjA4MzkxMTIzMH0.v1EE1kJlxvUsBZerWknKl5aMvM9R4iJSfH2g6qkSfRs';
    // IMPORTANTE: la variable se llama "sb" (no "supabase") para no chocar con el SDK global
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let historialDatos = [];
    let indiceActual = 0;
    let alumnoActualId = null;

    // --- INICIALIZACIÓN ---
    window.onload = cargarListaAlumnos;

    function mostrarLista() {
        document.getElementById('vista-lista').classList.remove('hidden');
        document.getElementById('vista-alta').classList.add('hidden');
        document.getElementById('vista-detalle').classList.add('hidden');
        cargarListaAlumnos();
    }

    function mostrarFormularioAlta() {
        document.getElementById('vista-lista').classList.add('hidden');
        document.getElementById('vista-alta').classList.remove('hidden');
        document.getElementById('vista-detalle').classList.add('hidden');
    }

    // --- FUNCIONES DE BASE DE DATOS ---
    async function cargarListaAlumnos() {
        const { data, error } = await sb.from('alumnos').select('*').order('apellido_alu', { ascending: true });
        if (error) return alert('Error al cargar: ' + error.message);

        const tbody = document.getElementById('tbody-alumnos');
        tbody.innerHTML = '';
        data.forEach(alu => {
            tbody.innerHTML += `
                <tr>
                    <td>${alu.dni_alu}</td>
                    <td>${alu.apellido_alu}, ${alu.nombre_alu}</td>
                    <td><button class="btn btn-primary" onclick="verDetalle(${alu.id_alu}, '${alu.nombre_alu} ${alu.apellido_alu}')">Ver / Editar</button></td>
                </tr>
            `;
        });
    }

    async function guardarNuevoAlumno() {
        const dni = document.getElementById('alta-dni').value;
        const apellido = document.getElementById('alta-apellido').value;
        const nombre = document.getElementById('alta-nombre').value;
        const fchnac = document.getElementById('alta-fchnac').value;

        if (!dni || !apellido || !nombre) return alert('Completa DNI, Apellido y Nombre');

        const { error } = await sb.from('alumnos').insert([{
            dni_alu: dni,
            apellido_alu: apellido,
            nombre_alu: nombre,
            fchnac_alu: fchnac
        }]);

        if (error) {
            alert('Error: ' + error.message);
        } else {
            alert('Alumno creado. El sistema generó su ficha de datos automáticamente.');
            mostrarLista();
        }
    }

    async function verDetalle(idAlu, nombreCompleto) {
        alumnoActualId = idAlu;
        document.getElementById('detalle-nombre').innerText = nombreCompleto;

        const { data, error } = await sb.from('datosalumno')
            .select('*')
            .eq('id_alu_da', idAlu)
            .order('fecha_carga_da', { ascending: false });

        if (error) return alert('Error al cargar historial: ' + error.message);

        historialDatos = data;
        indiceActual = 0;
        mostrarVersionActual();

        document.getElementById('vista-lista').classList.add('hidden');
        document.getElementById('vista-detalle').classList.remove('hidden');
    }

    function mostrarVersionActual() {
        if (historialDatos.length === 0) return;
        const dato = historialDatos[indiceActual];

        document.getElementById('info-version').innerText = `Registro ${indiceActual + 1} de ${historialDatos.length} (${dato.es_actual_da ? 'ACTUAL' : 'Histórico'})`;
        document.getElementById('det-cinturon').value = dato.idcinturon_da || '';
        document.getElementById('det-altura').value = dato.altura_da || '';
        document.getElementById('det-fchaltura').value = dato.fchaltura_da || '';
        document.getElementById('det-peso').value = dato.peso_da || '';
        document.getElementById('det-fchpeso').value = dato.fchpeso_da || '';
    }

    function cambiarVersion(direccion) {
        const nuevoIndice = indiceActual + direccion;
        if (nuevoIndice >= 0 && nuevoIndice < historialDatos.length) {
            indiceActual = nuevoIndice;
            mostrarVersionActual();
        }
    }

    async function guardarNuevaVersion() {
        if (!confirm('¿Guardar estos cambios como una NUEVA versión en el historial?')) return;

        const versionActual = historialDatos.find(d => d.es_actual_da);
        if (versionActual) {
            await sb.from('datosalumno').update({ es_actual_da: false }).eq('iddatosalu_da', versionActual.iddatosalu_da);
        }

        const nuevaAltura = document.getElementById('det-altura').value || null;
        const nuevoPeso = document.getElementById('det-peso').value || null;

        const { data, error } = await sb.from('datosalumno').insert([{
            id_alu_da: alumnoActualId,
            idcinturon_da: document.getElementById('det-cinturon').value,
            altura_da: nuevaAltura,
            fchaltura_da: document.getElementById('det-fchaltura').value || null,
            peso_da: nuevoPeso,
            fchpeso_da: document.getElementById('det-fchpeso').value || null,
            es_actual_da: true,
            fecha_carga_da: new Date().toISOString()
        }]).select();

        if (error) {
            alert('Error al guardar: ' + error.message);
        } else {
            alert('¡Nueva versión guardada exitosamente!');
            await sb.from('alumnos').update({ iddatosalu_alu: data[0].iddatosalu_da }).eq('id_alu', alumnoActualId);
            verDetalle(alumnoActualId, document.getElementById('detalle-nombre').innerText);
        }
    }
</script>
