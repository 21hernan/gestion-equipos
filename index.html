<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f0f2f5;
        }
        .menu {
            text-align: center;
        }
        .menu h1 {
            color: #333;
            margin-bottom: 40px;
        }
        .btn {
            display: block;
            width: 250px;
            padding: 20px;
            margin: 15px auto;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: #2563eb;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>Bienvenido</h1>
        <a href="/gestion.html" class="btn">Gestión</a>
        <a href="/alumnos.html" class="btn">Alumno</a>
    </div>
</body>
</html>
